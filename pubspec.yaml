name: bus_mate_bd
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  get: ^4.7.3
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  get_storage: ^2.1.1
  path_provider: ^2.1.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  collection: ^1.19.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_map_tile_caching: ^10.1.1
  geolocator: ^14.0.2
  http: ^1.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

